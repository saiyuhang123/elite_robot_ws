# ============================================================================
# 打磨系统参数配置（elite_polish_app）
# 修改后重新 launch 生效，无需重新编译。
# 说明: 代码内默认值 = 2026-07-27 标定值；此文件中的值覆盖默认值。
# ============================================================================

# ---------------- 状态机节点 ----------------
ysURForceAppControl:
  ros__parameters:
    # ---- 调试开关 ----
    # true = 空跑模式: 402 免接触直接过、404 力控旁路。真打磨必须 false！
    # 2026-08-01: 首次接触试跑，关闭空跑，让 402/404 力控真实参与（打磨机不转）。
    debug_skip_force_contact: false
    # 402 使用“预备姿态局部归零后的相对反作用力”，连续多帧低于阈值才确认接触。
    # 接触反作用力为负；-1N 配合连续帧确认可在碰撞报警前停止位置逼近。
    contact_fz_threshold: -1.0
    contact_confirm_samples: 8       # 125Hz 力数据连续 8 帧，拒绝单帧尖峰
    contact_settle_time: 0.3         # 到预备点且关节静止后先等待(s)
    contact_tare_samples: 25         # 在预备姿态采集局部力零点，约 0.2s
    contact_hold_time: 0.25          # 确认接触后保持当前位置再切力控(s)
    contact_hold_completion_margin: 0.20 # 等待轨迹action真正完成；实测result比time_from_start晚约50ms
    contact_joint_velocity_limit: 0.01  # 允许切换力控的最大关节速度(rad/s)
    contact_max_travel: 0.15         # 从预备点沿拟合法向最大搜索距离(m)
    contact_timeout: 90.0            # 实测约1.9mm/s；搜索150mm约78s，预留控制器余量
    contact_ik_max_failures: 5       # 端点IK连续失败5个周期才中止；单次超时自动缩步重试
    # 空跑模式接近轨迹起点的时长(s)，越大越慢
    debug_approach_time: 4.0

    # ---- 力控 ----
    # 2026-08-01 实测: -8N 会触发示教器力报警 → 先降到 -3N 跑通流程
    target_fz: -3.0          # 目标接触力(N, 负值=压向工件)
    # 2026-08-01: 0.0015→0.0005。0.0015 在刚性铁板上形成"过冲就退、不足就压"的
    # 大幅往复振荡(撞上又回来)；0.0005 ≈ 压入6.25mm/s、退回12.5mm/s，振荡幅度小。
    adjust_dz: 0.0005        # 每控制周期力控调整步长(m)
    # 2026-08-01: 1.5→2.0。略放宽死区减少往复振荡，仍能保持贴合。
    force_deadband: 2.0
    # 402 每 40ms 更新一次、每条轨迹约 0.48s；1mm 目标增量约等于 2mm/s 逼近。
    contact_step: 0.001
    # 2026-08-01: 接触力平均窗口。20≈0.16s(125Hz)，原 200 滞后~1.6s 过冲严重。
    wrench_average_count: 20

    # ---- 控制器内建力控（2026-08-02 起，startForceMode）----
    # true=接触后调用 startForceMode，z 向恒力由机器人控制器内部闭环完成，
    # 404 不再做 ±0.5mm bang-bang 位置修正（根治刚性板往复振荡）。
    # false=回退旧的 404 bang-bang 修正（仅调试用）。
    use_force_mode: true
    # SDK wrench 是“机器人施加给环境的力”，与传感器反作用力符号相反。
    # 当前 FIX 参考系 z+ 已核对为世界 x+；正值实现力小向 x+、力大向 x-。
    # SDK内部力与应用补偿/去皮后的relative_fz实测相差约1.1~1.2N：
    # SDK 0.5N -> relative约0N；SDK 2N -> relative约-0.85N。因此二者分开配置。
    force_mode_wrench_z: 3.0         # SDK内部施力目标；预计应用侧实际反作用力约-1.5~-2N
    force_mode_z_vel_limit: 0.002    # 力控z轴最大调整速度: 0.5→2mm/s。
                                     # 原0.5mm/s追不上打磨切向运动造成的法向扰动(实测0.2s内力涨25~40N/s)，
                                     # 导致力控"来不及退让"、力涨到-10N触发保护。2mm/s起步，仍保留防过冲余量。
    # startForceMode返回只表示socket写入成功；实测力稳定到目标附近后才开始切向运动。
    force_mode_sensor_target_fz: -1.5 # 应用补偿/去皮后的实际反作用力目标(N)
    force_mode_verify_tolerance: 0.6 # 传感器反作用力目标为-applied_Fz，允许误差(N)
    force_mode_verify_time: 0.5      # 连续在目标带内多久才开始打磨(s)
    force_mode_verify_timeout: 5.0   # 建立不了目标力则在切向运动前安全退出(s)
    # 当前实机接触点与视觉名义路径存在约27mm差异，临时放宽至40mm继续验证。
    force_mode_max_axial_deviation: 0.040 # 实际TCP相对接触偏置后名义路径的最大轴向偏移(m)
    force_mode_monitor_log_period: 1.0    # 每秒输出实际力和轴向补偿，确认第二行反向时是否回落
    force_mode_abort_fz: -5.0        # 20帧平均反作用力的持续过力阈值(N)
    force_mode_hard_abort_fz: -15.0  # 单帧瞬时硬保护阈值(N)
    force_mode_hard_abort_confirm_time: 0.03 # 硬过力需持续多久才退出(s)；拒绝打磨振动/噪声的单帧尖峰
    force_mode_abort_confirm_time: 0.12 # 平均力越过-5N需要持续的时间(s)
    force_mode_min_contact_fz: -0.15 # 高于此值视为失去接触(N)
    force_mode_contact_loss_timeout: 2.0  # 连续失去接触多久后退出(s)
    polish_tool_spinup_time: 1.0     # IO开启确认后原地稳压，期间不走切向轨迹(s)
    polish_tool_io_timeout: 2.0      # 等待打磨头SetIO开启响应的超时(s)

    # ---- 力传感器重力补偿（2026-08-01 起为参数，换负载只改这里）----
    # 实测驱动端负载识别只做当前姿态归零，非全姿态补偿；此处为真实工具重力模型：
    # tool_gravity = m*g*(世界系向下在base系方向)；tool_gcenter = 工具质心(m)。
    # 2026-08-01 示教器负载辨识: 1.520kg。tool_gravity 按 1.520/1.478 等比更新；
    # tool_gcenter 保持 7-27 值（示教器质心为法兰系，直换会破坏力矩补偿；力矩不参与力控）。
    tool_gravity: [11.0714, -0.1787, -9.9670]
    tool_gcenter: [-0.05632, 0.01936, -0.01986]

    # ---- 打磨轨迹(圆弧系下参数化路径) ----
    polishcurve_radius: 0.9306      # 弧面半径(m)
    polishcurve_center_dz: 1.89539  # 弧心 z 偏移(m)，与 radius 配对决定路径在圆弧系的高度
    polishcurve_start_ry_deg: -9.2  # 扫掠起始角(度)
    polishcurve_end_ry_deg: 9.2     # 扫掠结束角(度)
    # 当前试运行只打磨工件宽度中心的一行，完成后直接安全退刀返回。
    polishproduct_width: 0.15        # 打磨宽度(m) = 工件宽 15cm
    polishcurve_ycount: 1            # 单行打磨；目标行位于工件宽度中心
    dz_polish_startup_tool: -0.08   # 打磨预备点沿 tool z 抬高(m, 负值=远离工件)
    speed_level: 3                  # 速度等级(影响轨迹点数/时长)。2→3: 扫掠时长40s→60s，
                                    # 切向速度7.5mm/s→5mm/s，降低法向扰动注入速率，配合力控提速吸收。

    # ---- 退刀 ----
    # 世界系"上"在 base 系下的方向(45°倾斜安装实测, 与 biaoding/world_offset_calc.py 一致)
    world_up_in_base: [-0.7431, 0.0120, 0.6691]
    retract_lift_height: 0.15       # 世界系竖直抬刀高度(m)
    retract_axial_distance: 0.03    # 先沿世界X-/工具轴反向离开工件，再竖直抬升(m)

    # ---- 示教姿态 ----
    home_q_deg: [8.2, -93.6, -110.2, 57.4, 91.7, 91.6]              # Home(角度制)
    camera_capture_q_rad: [0.1204, -0.9960, -2.4689, 0.4922, 1.6232, 1.6037]  # 拍照位(弧度制)
    polish_base_q_rad: [0.4555, -1.3985, -1.6755, 0.5356, 1.3404, 1.4224]     # 打磨基准位(弧度制)

# ---------------- 视觉节点 ----------------
ysCamera3DSolver:
  ros__parameters:
    template_file: /tmp/    # 调试点云保存路径前缀(模板配准代码已注释, 不加载模板)
    # 点云最少点数门槛（低于则丢帧）：Camport 约 23.7 万点，D435 约 40 万点
    cloud_min_points: 100000

    # ---- 手眼标定: tool0 -> 相机光学系 ----
    # 来源: biaoding/hand_eye_result.json (cv2.calibrateHandEye 的 R_cam2tool/t_cam2tool)
    # 重新标定手眼后只需改这里！2026-07-31 更新: 已换 Camport(Percipio) 相机
    handeye_rpy: [0.009141, 0.026441, -1.610494]            # rad (R_cam2tool 换算)
    handeye_translation: [-0.127097, 0.046615, 0.083001]    # m (t_cam2tool)

    # ---- 大盒 (cs66_base_link 系, 工件整体包围盒) ----
    # 2026-08-01 手动单帧法重标(碰板心+点云探针)。工件/治具变动后需重标。
    target_box_min: [0.56, -0.30, 0.50]
    target_box_max: [0.92,  0.30, 0.83]

    # ---- 工件平面拟合 (base_link 系) ----
    # 默认用 target_box 内全部候选点做带方向约束的 RANSAC，不再用三个10×10mm小框
    # 的中心点叉乘法向。法向被约束在世界X+附近并强制朝向工件内部，防止符号翻转。
    plane_fit_enabled: true
    plane_fit_distance_threshold: 0.003 # RANSAC内点到平面的最大距离(m)
    plane_fit_max_iterations: 1000
    plane_fit_min_inliers: 1000         # 少于该内点数则拒绝本次视觉结果
    plane_fit_min_inlier_ratio: 0.15    # 内点/target_box点数下限
    plane_fit_max_rms: 0.0025           # 拟合内点距离RMS上限(m)
    plane_fit_max_normal_angle_deg: 10.0 # 工件法向相对世界X+最大允许偏角

    # plane_point_o 的 x/y 继续作为轨迹局部原点锚点，实际原点会投影到拟合平面。
    # 其余两个点只供 plane_fit_enabled=false 的旧三点法回退使用。
    plane_box_z_range: [0.50, 0.82]
    plane_point_o: [0.6844, -0.0091]  # 原点测点 (x, y) = 打磨头碰板心
    plane_point_x: [0.684,  0.111]
    plane_point_y: [0.638, -0.015]    # Y 参考测点

    # ---- 圆弧盒 (工件平面系下, 圈打磨特征区域) ----
    # 2026-07-27 v2: 放大到罩住盒面四边(+2cm 余量)，使包围盒=盒的真实边缘，
    # 盒子面内移动(上下左右)时 trans 跟随——实现面内跟踪。
    # 2026-07-31: z 下限从 -0.02 抬到 -0.010（排除工件下方桌面的点），
    # z 上限从 +0.02 扩到 +0.042（弧面顶部 z≈0.038，原值会切掉顶部）。
    # 2026-08-01: y 下限从 -0.13 抬到 +0.015（排除地面：地面在平面系 y<0.015，
    # 弧面 y 从 0.015 开始且其 min.z 在 y≈0.125 高端，裁底边不影响 trans(2)）；
    # z 上限 +0.042 → +0.046 罩住弧面顶部。两个支撑块在圆弧盒外（平面系 x≈±0.24），不影响。
    curve_box_min: [-0.18, 0.015, -0.010]
    curve_box_max: [ 0.21,  0.13,  0.046]

    # ---- 圆弧坐标系常数 ----
    curve_radius: 0.9306       # 与状态机 polishcurve_radius 一致
    curve_center_dz: 1.89539   # 与状态机 polishcurve_center_dz 一致
    curve_tool_offset: 0.205    # 打磨头(含沙盘)沿 tool z 伸出法兰长度(m)，2026-07-27 平贴实测 0.205；法兰目标=表面-此值×法向
    # 2026-08-01: 0.1 → 0.05。旧值按旧工件弧面 y 范围(-0.04~0.13)调，
    # 新工件弧面 y 范围 [0.018, 0.128]，旧值导致打磨带整体偏低、第一道从弧面中间开始。
    # 0.05 使三道 y≈0.118/0.078/0.038，第一道落在弧面上部（接近左上角）。
    curve_y_offset: 0.05       # trans(1) = max.y - 此值

    # ---- 工具姿态 ----
    # false: 工具Z+跟随RANSAC工件法向；单行扫掠方向由世界竖直投影约束，避免绕法向翻转。
    # true: 仅作为诊断回退，强制工具Z+=世界X+，会忽略工件实际倾角。
    tool_align_world: false
    world_up_in_base: [-0.7431, 0.0120, 0.6691]
