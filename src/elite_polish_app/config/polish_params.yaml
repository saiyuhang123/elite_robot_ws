# ============================================================================
# 打磨系统参数配置（elite_polish_app）
# 修改后重新 launch 生效，无需重新编译。
# 说明: 代码内默认值 = 2026-07-27 标定值；此文件中的值覆盖默认值。
# ============================================================================

# ---------------- 状态机节点 ----------------
ysURForceAppControl:
  ros__parameters:
    # ---- 调试开关 ----
    # true = 空跑模式: 402 免接触直接过、404 力控旁路。真打磨必须 false！
    # 2026-08-01: 首次接触试跑，关闭空跑，让 402/404 力控真实参与（打磨机不转）。
    debug_skip_force_contact: false
    # 402 使用“预备姿态局部归零后的相对反作用力”，连续多帧低于阈值才确认接触。
    # 接触反作用力为负；-1N 配合连续帧确认可在碰撞报警前停止位置逼近。
    contact_fz_threshold: -1.0
    # 2026-08-02: 力符号约定(用户实测"向法兰内部压为正")。地面板法兰向下后压板力读数为正,
    # 取-1翻回旧约定"压=负", 接触检测/力验证/过力保护/进给门控全部阈值保持不变。
    contact_force_sign: -1.0
    contact_confirm_samples: 8       # 125Hz 力数据连续 8 帧，拒绝单帧尖峰
    contact_settle_time: 0.3         # 到预备点且关节静止后先等待(s)
    contact_tare_samples: 25         # 在预备姿态采集局部力零点，约 0.2s
    contact_hold_time: 0.25          # 确认接触后保持当前位置再切力控(s)
    contact_hold_completion_margin: 0.20 # 等待轨迹action真正完成；实测result比time_from_start晚约50ms
    contact_joint_velocity_limit: 0.01  # 允许切换力控的最大关节速度(rad/s)
    contact_max_travel: 0.25         # 从预备点沿拟合法向最大搜索距离(m)；2026-08-02 地面板预备点距板20cm
    contact_timeout: 180.0           # 实测约1.9mm/s；搜索250mm约130s，预留控制器余量
    contact_ik_max_failures: 5       # 端点IK连续失败5个周期才中止；单次超时自动缩步重试
    # 定位/Nav2并行时5ms容易受CPU调度抖动影响；预备位求解成功后会缓存，不在4ms周期重复求解。
    ik_timeout: 0.05                 # TRAC-IK单次最长求解时间(s)，50ms
    startup_ik_attempts: 3           # 发布预备位轨迹前最多尝试次数；失败期间机械臂不动作
    # 空跑模式接近轨迹起点的时长(s)，越大越慢
    debug_approach_time: 4.0

    # ---- 力控 ----
    # 2026-08-01 实测: -8N 会触发示教器力报警 → 先降到 -3N 跑通流程
    target_fz: -3.0          # 目标接触力(N, 负值=压向工件)
    # 2026-08-01: 0.0015→0.0005。0.0015 在刚性铁板上形成"过冲就退、不足就压"的
    # 大幅往复振荡(撞上又回来)；0.0005 ≈ 压入6.25mm/s、退回12.5mm/s，振荡幅度小。
    adjust_dz: 0.0005        # 每控制周期力控调整步长(m)
    # 2026-08-01: 1.5→2.0。略放宽死区减少往复振荡，仍能保持贴合。
    force_deadband: 2.0
    # 402 每 40ms 更新一次、每条轨迹约 0.48s；1mm 目标增量约等于 2mm/s 逼近。
    contact_step: 0.001
    # 2026-08-01: 接触力平均窗口。20≈0.16s(125Hz)，原 200 滞后~1.6s 过冲严重。
    wrench_average_count: 20

    # ---- 控制器内建力控（2026-08-02 起，startForceMode）----
    # true=接触后调用 startForceMode，z 向恒力由机器人控制器内部闭环完成，
    # 404 不再做 ±0.5mm bang-bang 位置修正（根治刚性板往复振荡）。
    # false=回退旧的 404 bang-bang 修正（仅调试用）。
    use_force_mode: true
    # SDK wrench 是“机器人施加给环境的力”，与传感器反作用力符号相反。
    # 当前 FIX 参考系 z+ 已核对为世界 x+；正值实现力小向 x+、力大向 x-。
    # SDK内部力与应用补偿/去皮后的relative_fz实测相差约1.1~1.2N：
    # SDK 0.5N -> relative约0N；SDK 2N -> relative约-0.85N。因此二者分开配置。
    force_mode_wrench_z: 0.9         # SDK内部施力目标; 2026-08-02 1.2→0.9 再减压(治标): 实测反作用力约-0.2~-0.3N
    force_mode_z_vel_limit: 0.004    # 力控z轴最大调整速度: 4mm/s。
                                     # 原0.5mm/s追不上打磨切向运动造成的法向扰动(实测0.2s内力涨25~40N/s)，
                                     # 导致力控"来不及退让"、力涨到-10N触发保护。2mm/s仍出现尖峰后二次爬升，
                                     # 2026-08-02提到4mm/s配合进给门控; 若出现力控振荡回退到0.002。
    # 2026-08-02: 开放 Rx/Ry 旋转柔顺(目标力矩0)。板法向与工具轴不对齐时砂轮边缘接触，
    # 产生Mx/My力矩和侧向拖曳；false=退回纯Z力控。
    # 2026-08-02 A/B: 开启后两次实机均在随机位置出现-30N级撞击尖峰后停摆(改前无此形态)，
    # 疑似无阻尼旋转柔顺在扫掠中振荡啃边，先关闭验证；长期方案改走砂盘安装角一次性补偿。
    force_mode_rot_compliance: false
    force_mode_rot_vel_limit: 0.05   # 旋转柔顺轴最大角速度(rad/s)≈3°/s，默认关闭
    # 2026-08-02: 应用层慢姿态环(替代SDK旋转柔顺)。404每控制拍用20帧平均力矩对轨迹
    # 姿态做慢积分修正(绕TCP原点旋转)，消除砂盘安装角/贴合误差造成的边缘接触dig-in。
    # 只追准静态偏差；快扰动交给z向力控和watchdog。符号: d=-gain*M，力矩增大说明符号反了。
    # 2026-08-02 实机结论: 默认关闭。平静期力矩大头是侧向摩擦力×杠杆臂(实测与h≈0.12m
    # 模型吻合)，转姿态消不掉，环持续积分到1.44°后砂盘边缘咬住撞出-42N尖峰——与SDK
    # 旋转柔顺同一死法。力矩驱动的姿态自适应(任何层)均不可用，保留代码仅备摩擦力矩
    # 补偿(h×F_lat)版本改造后复测。
    orient_adapt_enabled: false
    orient_adapt_gain: 0.007         # 积分增益 rad/(N·m·s)：1N·m力矩约0.4°/s修正速率
    orient_adapt_torque_deadband: 0.10 # 力矩死区(N·m)，防传感器噪声来回抖
    orient_adapt_max_angle: 0.035    # 修正限幅(rad)≈±2°，逻辑出错也歪不了多少
    orient_adapt_max_rate: 0.009     # 修正变化率上限(rad/s)≈0.5°/s
    # 2026-08-02: 进给门控。力控模式下轨迹索引原按时间无条件推进，力突增时切向照走，
    # 把打磨头"压着走"造成二次爬升(历次 averaged_overforce 停摆的直接死因)。
    # 过载即暂停推进、目标保持当前点，等z向力控拉回带内再走；超时按正常流程退出。
    feed_gate_enabled: true
    feed_gate_fz: -5.5               # 20帧平均力过载阈值(N)，需高于 force_mode_abort_fz(-15)的绝对值低侧
                                     # 门控仍先于退出线介入
    feed_gate_timeout: 3.0           # 门控最长持续(s)，防产线悬死
    # startForceMode返回只表示socket写入成功；实测力稳定到目标附近后才开始切向运动。
    force_mode_sensor_target_fz: 0.0  # 应用层力控建立验证中心值(N)
    force_mode_verify_tolerance: 7.0  # 验证范围为 -7～+7N
    force_mode_verify_time: 0.5      # 连续在目标带内多久才开始打磨(s)
    force_mode_verify_timeout: 5.0   # 建立不了目标力则在切向运动前安全退出(s)
    # 当前实机接触点与视觉名义路径存在约27mm差异，临时放宽至40mm继续验证。
    force_mode_max_axial_deviation: 0.040 # 实际TCP相对接触偏置后名义路径的最大轴向偏移(m)
    force_mode_monitor_log_period: 1.0    # 每秒输出实际力和轴向补偿，确认第二行反向时是否回落
    force_mode_abort_fz: -15.0       # 20帧平均反作用力的持续过力阈值(N); 绝对值15N
    force_mode_hard_abort_fz: -15.0  # 单帧瞬时硬保护阈值(N)
    force_mode_hard_abort_confirm_time: 0.03 # 硬过力需持续多久才退出(s)；拒绝打磨振动/噪声的单帧尖峰
    force_mode_abort_confirm_time: 0.12 # 平均力越过-15N需要持续的时间(s)
    # 2026-08-02: 侧向力保护通道。侧向拖曳(法向不对齐/刮边)的Fx/Fy通常先于Fz失控，
    # 等Fz耦合超-5N时打磨头已别得很紧；平均侧向合力超阈值即提前按同一流程退出。
    # 判定用预备姿态去皮后的相对值(与fz同源采样)：重力模型残差实测5~10N，绝对值会误触发。
    force_mode_abort_lateral_f: 35.0 # 20帧平均侧向合力相对值sqrt((fx-fx0)^2+(fy-fy0)^2)的阈值(N);
                                     # 按实测侧向拖拽保护阈值调整为35N
    force_mode_lateral_abort_confirm_time: 0.12 # 侧向过力需持续多久才退出(s)
    # 用户现场确认脱离工件不会造成事故；放宽到 +3N，避免轻载/悬空时误停。
    # 判定仍为 relative_fz > 3N 持续超时才视为脱离。
    force_mode_min_contact_fz: 3.0
    force_mode_contact_loss_timeout: 2.0  # 连续失去接触多久后退出(s)
    polish_tool_spinup_time: 1.0     # IO开启确认后原地稳压，期间不走切向轨迹(s)
    polish_tool_io_timeout: 2.0      # 等待打磨头SetIO开启响应的超时(s)

    # ---- 力传感器重力补偿（2026-08-01 起为参数，换负载只改这里）----
    # 实测驱动端负载识别只做当前姿态归零，非全姿态补偿；此处为真实工具重力模型：
    # tool_gravity = m*g*(世界系向下在base系方向)；tool_gcenter = 工具质心(m)。
    # 2026-08-01 示教器负载辨识: 1.520kg。tool_gravity 按 1.520/1.478 等比更新；
    # tool_gcenter 保持 7-27 值（示教器质心为法兰系，直换会破坏力矩补偿；力矩不参与力控）。
    tool_gravity: [11.0714, -0.1787, -9.9670]
    tool_gcenter: [-0.05632, 0.01936, -0.01986]

    # ---- 打磨轨迹(圆弧系下参数化路径) ----
    polishcurve_radius: 0.9306      # 弧面半径(m)
    polishcurve_center_dz: 1.89539  # 弧心 z 偏移(m)，与 radius 配对决定路径在圆弧系的高度
    polishcurve_start_ry_deg: -9.2  # 扫掠起始角(度)
    polishcurve_end_ry_deg: 9.2     # 扫掠结束角(度)
    # 当前试运行只打磨工件宽度中心的一行，完成后直接安全退刀返回。
    polishproduct_width: 0.15        # 打磨宽度(m) = 工件宽 15cm
    polishcurve_ycount: 1            # 单行打磨；目标行位于工件宽度中心
    dz_polish_startup_tool: -0.08   # 打磨预备点沿 tool z 抬高(m, 负值=远离工件)
    speed_level: 4                  # 速度等级(影响轨迹点数/时长)。2→3: 扫掠时长40s→60s，
                                    # 切向速度7.5mm/s→5mm/s，降低法向扰动注入速率，配合力控提速吸收。

    # ---- 退刀 ----
    # 世界系"上"在 base 系下的方向(45°倾斜安装实测, 与 biaoding/world_offset_calc.py 一致)
    world_up_in_base: [-0.7431, 0.0120, 0.6691]
    retract_lift_height: 0.15       # 世界系竖直抬刀高度(m)
    retract_axial_distance: 0.03    # 先沿世界X-/工具轴反向离开工件，再竖直抬升(m)
    # 2026-08-02: 退刀前等 endForceMode 响应后再静置这么久(s)。驱动侧控制器
    # deactivate/activate 切换途中到达的轨迹 goal 会被取消(收工不退刀的根因)。
    retract_disable_settle_time: 1.0

    # ---- 示教姿态 ----
    # 2026-08-02 改: 地面平放板+法兰向下打磨布置。home/拍照位=用户示教值。
    # 与抓取调度的 HOME2_JOINTS 完全一致；导航前、打磨结束、失败/取消收尾都回此收拢位。
    home_q_deg: [-2.2001579333, 19.6982889966, -154.8017370884, -86.2989031026, 94.1025882723, 84.2018775724]  # Home2(由抓取侧弧度值精确换算)
    camera_capture_q_rad: [-0.020944, -1.001819, -1.661553, -1.193805, 1.570796, 1.675516]  # 拍照位(弧度制)
    polish_base_q_rad: [0.050615, -1.385791, -1.876229, -0.523599, 1.642355, 0.174533]     # 打磨基准位(弧度制, 2026-08-02 地面板正上方20cm示教)

# ---------------- 视觉节点 ----------------
ysCamera3DSolver:
  ros__parameters:
    template_file: /tmp/    # 调试点云保存路径前缀(模板配准代码已注释, 不加载模板)
    # 点云最少点数门槛（低于则丢帧）：Camport 约 23.7 万点，D435 约 40 万点
    cloud_min_points: 100000

    # ---- 手眼标定: tool0 -> 相机光学系 ----
    # 来源: biaoding/hand_eye_result.json (cv2.calibrateHandEye 的 R_cam2tool/t_cam2tool)
    # 重新标定手眼后只需改这里！2026-07-31 更新: 已换 Camport(Percipio) 相机
    handeye_rpy: [0.009141, 0.026441, -1.610494]            # rad (R_cam2tool 换算)
    handeye_translation: [-0.127097, 0.046615, 0.083001]    # m (t_cam2tool)

    # ---- 大盒 (cs66_base_link 系, 工件整体包围盒) ----
    # 2026-08-09 地面板标定(biaoding/analyze_ground_board.py 基于留底云): 盒内板面占99.2%,
    # 深层杂物0.3%。板面在base系为斜面, z下限按最低板面角-8mm。
    # 板子相对 08-02 位置平移约 +11cm(x)/+2cm(y), 表面更低。
    target_box_min: [0.813, -0.300, 0.202]
    target_box_max: [0.938,  0.071, 0.382]

    # ---- 深度地面差分 / 动态 ROI（移动平台停车容差扩展）----
    # 三种 roi_mode，失败按 depth → cluster → fixed 链式回退：
    # depth:   从原始 organized 深度图自动拟合地面，按离地高度提取最大矩形板面，
    #          输出板面点云后继续走精 RANSAC；不依赖固定像素框或 YOLO。
    # cluster: 先在 dynamic_coarse_box 内提取多个候选平面，按法向和质心先验选
    #          工件平面，再动态生成局部 ROI 交给精 RANSAC。粗框可比固定盒大很多。
    # fixed:   完全沿用上方固定 target_box（旧行为）。
    roi_mode: depth
    depth_board_request_topic: /elite_polish/depth_board_request
    depth_board_cloud_topic: /elite_polish/depth_board_points
    depth_detection_wait_timeout: 3.0          # 发视觉命令后等待新深度检测结果的最长时间(s)
    depth_axis_from_plane_pca: true            # 用矩形长轴决定扫掠方向，跟随板面平面内旋转
    dynamic_coarse_box_min: [0.70, -0.42, 0.19]   # base系粗搜索盒，必须罩住最大停车误差
    dynamic_coarse_box_max: [1.05,  0.20, 0.42]
    dynamic_voxel_size: 0.004                      # 粗分割前降采样
    dynamic_plane_distance_threshold: 0.004        # 候选平面距离阈值
    dynamic_max_planes: 6                          # 最多提取候选平面数
    dynamic_min_inliers: 1000                      # 候选平面最少点数
    dynamic_normal_tolerance_deg: 12.0             # 候选平面法向容差
    dynamic_expected_center: [0.876, -0.115, 0.292] # 工件平面质心先验（当前板中心）
    dynamic_center_xy_tol: 0.18                    # 候选平面质心 xy 容差（对应约±12cm停车误差）
    dynamic_center_z_tol: 0.06                     # z 容差：排除地面/其他水平面
    dynamic_roi_xy_padding: 0.010                  # 候选平面 bbox xy 回捞余量
    dynamic_roi_z_padding: 0.003                   # z 回捞余量（小，避免捞回地面）
    # 动态工位下固定框可能指向旧位置；深度和 cluster 都失败时默认停止，不继续用旧框。
    dynamic_roi_fallback_to_fixed: false
    dynamic_origin_from_plane_centroid: true       # depth/cluster 原点跟随本次板面质心

    # ---- 工件平面拟合 (base_link 系) ----
    # 默认用 target_box 内全部候选点做带方向约束的 RANSAC，不再用三个10×10mm小框
    # 的中心点叉乘法向。法向被约束在世界X+附近并强制朝向工件内部，防止符号翻转。
    plane_fit_enabled: true
    plane_fit_distance_threshold: 0.003 # RANSAC内点到平面的最大距离(m)
    plane_fit_max_iterations: 1000
    plane_fit_min_inliers: 1000         # 少于该内点数则拒绝本次视觉结果
    plane_fit_min_inlier_ratio: 0.15    # 内点/target_box点数下限
    plane_fit_max_rms: 0.0025           # 拟合内点距离RMS上限(m)
    plane_fit_max_normal_angle_deg: 10.0 # 工件法向相对世界X+最大允许偏角
    # 2026-08-02 鲁棒化: 板子挪动后固定裁剪框可能压到板边/杂物导致拟合歪。
    # 第二遍在首遍内点上重拟合剔除离面污染; 内点只是一窄条(板边/棱)时判失败重拍。
    plane_fit_refit_enabled: true       # 首遍拟合后再在内点上重拟合一遍
    plane_fit_min_extent_x: 0.12        # 内点平面局部x(扫掠向)最小覆盖(m)
    plane_fit_min_extent_y: 0.10        # 内点平面局部y(竖直向)最小覆盖(m)
    # 2026-08-02: 地面平放板+法兰向下打磨布置。期望法向=世界向下(=-world_up_in_base)。
    # 平面参考=世界X(base系[0.669,0,0.743]): 使扫掠方向=世界Y=板长边(34cm, 容纳±0.149m行程),
    # 换道方向=板短边(15cm)。删除/置空即回旧逻辑(竖直板)。
    # 注意: 此布置下地面是与板面同族的水平面, target_box 的 z 下限必须切在地面与板面之间！
    plane_expected_normal_in_base: [0.7431, -0.0120, -0.6691]
    plane_up_reference_in_base: [0.669, 0.0, 0.743]

    # plane_point_o 的 x/y 继续作为轨迹局部原点锚点，实际原点会投影到拟合平面。
    # 其余两个点只供 plane_fit_enabled=false 的旧三点法回退使用。
    # 2026-08-09: 地面板标定(analyze_ground_board.py 实测板心; 碰点 du=-0.011 dv=-0.005)。
    plane_box_z_range: [0.50, 0.82]
    plane_point_o: [0.8760, -0.1149]  # 原点测点 (x, y) = 云实测板心(碰点+du/dv修正)
    plane_point_x: [0.684,  0.111]
    plane_point_y: [0.638, -0.015]    # Y 参考测点

    # ---- 板面局部盒（depth 模式以自动板心为原点、PCA 长轴为 x）----
    # 范围略大于 34cm×15cm 实板；输入已经是深度差分后的板面点云，不会捞入地面。
    curve_box_min: [-0.20, -0.10, -0.008]
    curve_box_max: [ 0.20,  0.10,  0.005]

    # ---- 圆弧坐标系常数 ----
    curve_radius: 0.9306       # 与状态机 polishcurve_radius 一致
    curve_center_dz: 1.89539   # 与状态机 polishcurve_center_dz 一致
    curve_tool_offset: 0.183     # 打磨头(含沙盘)沿 tool z 伸出法兰长度(m)，2026-07-27 平贴实测 0.205；法兰目标=表面-此值×法向
    curve_y_offset: 0.075      # max.y(约+0.075)-0.075=板宽中心，单行从中心通过

    # ---- 工具姿态 ----
    # false: 工具Z+跟随RANSAC工件法向；单行扫掠方向由世界竖直投影约束，避免绕法向翻转。
    # true: 仅作为诊断回退，强制工具Z+=世界X+，会忽略工件实际倾角。
    tool_align_world: false
    world_up_in_base: [-0.7431, 0.0120, 0.6691]

# ---------------- 深度地面差分节点 ----------------
depth_board_detect_node:
  ros__parameters:
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/depth/camera_info
    board_cloud_topic: /elite_polish/depth_board_points
    board_info_topic: /elite_polish/depth_board_info
    debug_mask_topic: /elite_polish/depth_board_mask
    request_topic: /elite_polish/depth_board_request
    show_debug_image: true
    max_attempts: 5

    # Camport C16 深度单位；若相机改发 32FC1，节点自动按米读取，不使用此倍率。
    depth_scale: 0.00025
    min_depth_m: 0.20
    max_depth_m: 2.50
    sample_stride: 4

    # 地面主平面
    ransac_iterations: 160
    floor_distance_threshold_m: 0.004
    floor_min_inlier_ratio: 0.45
    floor_max_rms_m: 0.004

    # 2026-08-19 现场深度实测：板面比地面高约 112.9mm，使用 90~140mm 质量门。
    board_height_min_m: 0.090
    board_height_max_m: 0.140
    board_plane_threshold_m: 0.003
    board_max_rms_m: 0.003
    board_max_parallel_angle_deg: 8.0

    # 最大矩形及真实尺寸门。当前板约 0.34m×0.15m，范围故意留有余量。
    board_min_pixels: 2500
    board_min_points: 1500
    board_min_rectangularity: 0.60
    board_length_min_m: 0.25
    board_length_max_m: 0.45
    board_width_min_m: 0.10
    board_width_max_m: 0.25
    morphology_close_px: 9
    morphology_open_px: 3
